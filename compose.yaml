name: mrba-dev
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: mrba
      POSTGRES_USER: mrba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrba -d mrba"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
