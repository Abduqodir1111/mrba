name: mrba-production
services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    restart: unless-stopped
    environment:
      POSTGRES_DB: mrba
      POSTGRES_USER: mrba_owner
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set migration password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set application password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mrba_owner -d mrba']
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://mrba_owner:${MIGRATION_DB_PASSWORD}@postgres:5432/mrba
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://mrba_app:${APP_DB_PASSWORD}@postgres:5432/mrba
      JWT_SECRET: ${JWT_SECRET:?Set JWT secret}
      RECOVERY_EPOCH: ${RECOVERY_EPOCH:?Set recovery epoch}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/api.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIRECTORY:?Set TLS directory}:/etc/nginx/tls:ro
    depends_on:
      api: {condition: service_healthy}
    networks: [frontend]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: mrba_owner
      PGDATABASE: mrba
      PGPASSWORD: ${MIGRATION_DB_PASSWORD}
      BACKUP_RECIPIENT: ${BACKUP_RECIPIENT:?Set GPG recipient fingerprint}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      OFFSITE_DESTINATION: ${OFFSITE_DESTINATION:?Set user@backup-host:path}
    volumes:
      - ${BACKUP_DIRECTORY:?Set persistent backup path}:/backups
      - ${BACKUP_PUBLIC_KEY:?Set public key path}:/keys/recipient.asc:ro
      - ${BACKUP_SSH_DIRECTORY:?Set SSH directory with known_hosts}:/root/.ssh:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database, backup-egress]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$(find /backups -name last-success -mmin -1560 -print)"']
      interval: 1h
      timeout: 5s
      start_period: 10m
      retries: 1
networks:
  database: {internal: true}
  frontend:
  backup-egress:
volumes:
  postgres_data:
