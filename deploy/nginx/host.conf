limit_req_zone $binary_remote_addr zone=mrba_api:10m rate=10r/s;
server {
  listen 80;
  server_name mrba.uz api.mrba.uz;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name api.mrba.uz;
  ssl_certificate /etc/letsencrypt/live/mrba.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mrba.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 256k;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  location /demo/api/v1/ {
    limit_req zone=mrba_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:3108/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
  }
  location /api/v1/ {
    limit_req zone=mrba_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:3107;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
  }
  location / { return 404; }
}
server {
  listen 443 ssl;
  server_name mrba.uz;
  ssl_certificate /etc/letsencrypt/live/mrba.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mrba.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  root /var/www/mrba;
  index index.html;
  location / { try_files $uri $uri.html $uri/ =404; }
}
